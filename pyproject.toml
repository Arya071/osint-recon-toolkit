[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-recon-toolkit"
version = "0.2.0"
description = "Passive OSINT recon tool for domains/organizations with MITRE ATT&CK mapping and risk scoring"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "python-whois>=0.9.4",
    "dnspython>=2.5.0",
    "shodan>=1.31.0",
    "Jinja2>=3.1.3",
    "python-dotenv>=1.0.1",
    "Pillow>=10.2.0",
    "PyPDF2>=3.0.1",
]

[project.scripts]
osint-recon = "osint_recon_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["osint_recon_toolkit*"]

[tool.setuptools.package-data]
osint_recon_toolkit = ["templates/*.html"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM"]
ignore = ["E501"]
